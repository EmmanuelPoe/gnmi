name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gnmic
          POSTGRES_PASSWORD: gnmic
          POSTGRES_DB: telemetry
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U gnmic -d telemetry"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GNMIC_RS_TEST_PG_URL: postgres://gnmic:gnmic@127.0.0.1:55432/telemetry
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
